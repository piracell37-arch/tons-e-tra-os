name: Gerar APK Monetizado

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        
        - name: Configurar Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Instalar Dependencias do Projeto
      run: |
        cd traco-e-tom-para-apk
        npm install

    - name: Adicionar e Sincronizar Plataforma Android
      run: |
        cd traco-e-tom-para-apk
        npx cap add android || true
        npx cap sync android

    - name: Compilar APK com Gradle
      run: |
        cd traco-e-tom-para-apk/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Enviar APK Pronto
      uses: actions/upload-artifact@v4
      with:
        name: Jogo-Monetizado-APK
        path: traco-e-tom-para-apk/android/app/build/outputs/apk/debug/app-debug.apk
